# The fleet's Rust toolchain: the stable release the dev laptop runs, pinned
# exactly so that CI builds, lints and formats with the same rustc, clippy
# and rustfmt. rustup reads this file and installs the toolchain on first
# use; CI installs it with `rustup toolchain install`, and the release job
# adds the one cross target it builds. Bump it fleet-wide and regularly, so
# new lints are not left behind: `rustup update stable`, then copy its
# version here.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
profile = "minimal"

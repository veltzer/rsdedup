# rsconstruct configuration for this repository.
#
# CI (.github/workflows/ci.yml, byte-identical across all rs* repos) runs
# cargo directly; this file declares what a developer machine needs so that
# `rsconstruct tool install-deps` and `rsconstruct doctor` can set it up.

# ─── dependencies ────────────────────────────────────────────────────────────

# The crates every rs* repo's build and release run, installed with
# `rsconstruct tool install-deps` (cargo install --locked, by crate name).
# cargo-deny and cargo-nextest are what the shared ci.yml runs, mdbook builds
# docs/, and cargo-release reads release.toml. rustfmt and clippy are rustup
# components, not crates, so they are absent. This block is byte-identical
# across all rs* repos: change it everywhere or nowhere.
[dependencies]
cargo = ["cargo-deny", "cargo-nextest", "cargo-release", "mdbook"]
